name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Jasmine spec file(s) to run instead of the full suite'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        node_version: ['lts/*', 'node']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        if: ${{ inputs.test-filter == '' }}
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        if: ${{ inputs.test-filter == '' }}
        run: npm run test:specs
      - name: Run Filtered Tests
        if: ${{ inputs.test-filter != '' }}
        run: npm test -- ${{ inputs.test-filter }}
      - name: Build and Pack 🗜️
        if: ${{ matrix.node_version == 'lts/*' }}
        run: |
          npm run build
          mkdir -p seal-dist
          npm pack
          mv marked-*.tgz seal-dist/
          ls -l seal-dist
      - name: Upload Package
        if: ${{ matrix.node_version == 'lts/*' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: seal-dist/*.tgz
          if-no-files-found: error

  Release:
    needs: [Test]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: |
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build [skip ci]"
          fi
      - name: Release 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
